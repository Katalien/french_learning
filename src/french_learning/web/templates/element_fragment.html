{# Теория или текст во второй половине экрана рядом с упражнением (009, FR-032) #}
<div class="side-pane-body reading" {% if element.kind == "text" %}lang="fr"{% endif %}>
  <div class="side-pane-head">
    <strong {% if element.kind == "text" %}lang="fr"{% endif %}>{{ element.title }}</strong>
    <a href="/elements/{{ element.id }}" class="small">открыть отдельно</a>
  </div>
  {{ element.body | markdown(path, element.id) }}
</div>
