{# Теория или текст во второй половине экрана рядом с упражнением (009, FR-032) #}
<div class="side-pane-body reading" {% if element.kind == "text" %}lang="fr"{% endif %}>
  <div class="side-pane-head">
    <strong {% if element.kind == "text" %}lang="fr"{% endif %}>{{ element.title }}</strong>
    <a href="/elements/{{ element.id }}" class="small">открыть отдельно</a>
  </div>
  <div data-translate {% if element.lesson %}data-lesson="{{ element.lesson }}"{% endif %} {% if notes_json is defined %}data-note-container="{{ element.id }}"{% endif %}>{{ element.body | markdown(path, element.id) }}</div>
</div>
{% if notes_json is defined %}<script type="application/json" class="notes-data" data-notes-json>{{ notes_json | safe }}</script>{% endif %}
