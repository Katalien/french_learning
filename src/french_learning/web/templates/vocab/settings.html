{% extends "base.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h1>Настройки повторения</h1>
<form method="post" action="/settings">
  <label>Карточек за один подход (из словаря)
    <input type="number" name="portion_size" min="1" max="500" value="{{ portion_size }}">
  </label>
  <fieldset>
    <legend>Новые слова</legend>
    <label><input type="radio" name="directions" value="staged" {% if directions == "staged" %}checked{% endif %}>
      Сначала французский → русский; русский → французский — после первого «Помню»</label>
    <label><input type="radio" name="directions" value="both" {% if directions == "both" %}checked{% endif %}>
      Сразу в обоих направлениях</label>
  </fieldset>
  <button type="submit">Сохранить</button>
</form>
{% endblock %}
