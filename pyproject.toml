[project]
name = "french-learning"
version = "0.1.0"
description = "Личное приложение для изучения французского: уроки, словарь, упражнения"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "mammoth>=1.13.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nh3>=0.3.7",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
french-learning = "french_learning.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/french_learning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "ruff>=0.16.9",
]
